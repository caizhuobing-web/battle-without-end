:root{
  --bg:#15130f;--panel:#211d16;--panel2:#2a241a;--line:#4b402e;

*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#2a241a,#11100d 60%);color:var(--text);font:14px/1.45 Arial,"Microsoft YaHei",sans-serif}
button,select{font:inherit}
button{background:#3a3022;color:var(--text);border:1px solid #665437;padding:7px 10px;cursor:pointer}

.shell{max-width:1240px;margin:auto;padding:10px}
.topbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:#1b1812;padding:10px 13px}
h1{font-size:22px;margin:0;color:#f0c86d;letter-spacing:1px}
.subtitle{color:var(--muted);font-size:12px}
.resources{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}

.layout{display:grid;grid-template-columns:330px 1fr;gap:10px;margin-top:10px}
.panel{border:1px solid var(--line);background:linear-gradient(#242016,#1b1812);box-shadow:0 4px 16px #0006}
.panel-title{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--gold);font-weight:bold;background:#2b251b}
.battle{padding:10px}
.combatant{border:1px solid #554830;background:#17140f;padding:9px;margin-bottom:8px}
.name-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.big-name{font-weight:bold;font-size:16px}
.badge{padding:2px 6px;border:1px solid #68583b;font-size:11px}
.bar{height:14px;background:#0f0d0a;border:1px solid #403624;margin-top:6px;position:relative}
.fill{height:100%;transition:width .18s}
.hp{background:linear-gradient(90deg,#7b201a,#d85445)}
.mp{background:linear-gradient(90deg,#224f78,#4d99cf)}
.bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;color:#fff;text-shadow:0 1px 2px #000}
.stats-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
.stats-mini div{background:#262017;padding:5px;text-align:center;font-size:11px}
.log{height:310px;overflow:auto;border-top:1px solid var(--line);background:#11100d;padding:8px;font-size:12px}
.log div{margin-bottom:4px}
.log .win{color:var(--good)}.log .lose{color:var(--bad)}.log .loot{color:#e9c96d}.log .skill{color:#85b9e6}.log .sys{color:#aaa}
.tabs{display:flex;gap:4px;padding:7px;border-bottom:1px solid var(--line);overflow:auto;background:#1b1812}
.tab{white-space:nowrap}
.tab.active{border-color:var(--gold);color:#ffe08c;background:#4b3b22}
.content{padding:12px;min-height:630px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:1px solid var(--line);background:#201b14;padding:9px}

.muted{color:var(--muted);font-size:12px}

.stat{background:#17140f;border:1px solid #403624;padding:8px;text-align:center}

.item{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #3b3224;padding:8px 0}

.item-name{font-weight:bold}
.r0{color:#b8b1a5}.r1{color:#72c57d}.r2{color:#67a9e2}.r3{color:#c28adf}.r4{color:#e2b752}.r5{color:#ff5151;font-weight:bold;text-shadow:0 0 7px #b30000}.mutant-x{color:#ff4242;font-weight:800;text-shadow:0 0 8px #d00000}.mutant-card{box-shadow:inset 3px 0 0 #c33131}.law-card{border:1px solid rgba(172,126,255,.45);box-shadow:inset 3px 0 0 #8b5cf6}.law-name{color:#c5a8ff;font-weight:800}.rebirth-power{font-size:1.08em;font-weight:800}.grade-F{color:#8c8982}.grade-E{color:#9a927f}.grade-D{color:#72a675}.grade-C{color:#58a5c7}.grade-B{color:#557fe0}.grade-A{color:#9b68d1}.grade-S{color:#dd9745;font-weight:bold}.grade-SS{color:#e05c7a;font-weight:bold}.grade-SSS{color:#f1cf52;font-weight:bold;text-shadow:0 0 7px #d28732}

}

const QUALITY_SCORE_MULT=[1,1.32,1.75,2.15,2.65,4.15];
function equipmentTier(mapDef=map(),sourceThreat=null){
 return mapDef.gearTier||1;
}
function gearTierScore(tier,rarity=0){
 return Math.round(32*Math.pow(1.75,Math.max(0,tier-1))*(QUALITY_SCORE_MULT[rarity]||1));
}
function inferItemTier(it){
 if(Number.isFinite(it.tier))return Math.max(1,Math.round(it.tier));
 const src=MAPS.find(m=>m.id===it.sourceMap);
 if(src)return equipmentTier(src,it.sourceThreat||0);
 return Math.max(1,Math.round(it.itemLevel||1));
}
function inferItemLevel(it){return inferItemTier(it)}
function gearTargetScore(level,rarity=0){return gearTierScore(Math.max(1,Math.round(level)),rarity)}

function rollAmuletArcanes(rarity){

function ensureGearScorePrefs(){

function renderInventory(){
 const ordered=sortedInventory(),prefs=ensureGearScorePrefs(),statOptions=(selected)=>`<option value="">不指定</option>${Object.entries(GEAR_STAT_NAMES).map(([id,n])=>`<option value="${id}" ${selected===id?'selected':''}>${n}</option>`).join('')}`;
 return`<div class="notice">装备评分采用“角色适配评分”：允许同一种普通词条重复出现，因此神话装备可以六条全部是暴击、敏捷或力量。项链是特殊规则槽：除普通词条外，稀有以上有机会额外出现仅项链可拥有的“秘仪词条”；神话项链必带秘仪并有极低概率双秘仪。</div>
 <div class="grid2"><div class="card"><h3>评分偏好</h3><div class="muted">${STYLES[state.style].name}默认权重已内置；玩家只需要指定最在意的三个属性，不需要自己填写倍率。当前职业默认：${GEAR_SCORE_DEFAULTS[state.style].map(x=>GEAR_STAT_NAMES[x]).join(' ＞ ')}。</div>
 <p>核心属性 <select onchange="setGearScorePref('primary',this.value)">${statOptions(prefs.primary)}</select></p>
 <p>次要属性 <select onchange="setGearScorePref('secondary',this.value)">${statOptions(prefs.secondary)}</select></p>
 <p>辅助属性 <select onchange="setGearScorePref('tertiary',this.value)">${statOptions(prefs.tertiary)}</select></p>
 <button onclick="resetGearScorePrefs()">恢复职业默认</button>
 <div class="muted" style="margin-top:8px">当前偏好：${['primary','secondary','tertiary'].map(k=>prefs[k]?GEAR_STAT_NAMES[prefs[k]]:'—').join(' ＞ ')}。评分只用于比较装备，不直接改变战斗属性。</div></div>
 <div class="card"><h3>自动与批量处理</h3><div class="muted">背包严格按“相对当前槽位的角色适配评分提升”排序。有提升的在前；一键出售也使用当前评分偏好。</div><select onchange="state.autoSell=Number(this.value);render()">${RARITIES.map((r,i)=>`<option value="${i}" ${state.autoSell===i?'selected':''}>保留${r.name}及以上</option>`).join('')}</select><p>背包 ${state.inventory.length}/${state.inventoryCapacity}</p><button onclick="sellNonUpgradeItems()">一键出售无适配提升装备</button></div></div>
 <div class="card" style="margin-top:10px"><h3>项链秘仪</h3><div class="muted">项链除了普通属性，还可能改变战斗规则。当前秘仪池：时间折叠（全技能冷却-1，仅传说/神话）、猎手罗盘（Boss循环需求-1）、血契（全域吸血）、超限视界（暴击递减效率）、咒术共鸣（技能触发率）、血脉共振（宠物专属技能）、首领猎印（Boss伤害）。这些效果不会出现在其他装备槽。</div></div>
 <div class="card" style="margin-top:10px"><h3>当前装备</h3>${SLOTS.map(slot=>{const it=state.equipment[slot];const fit=it?gearFitLabel(it):null;return`<div class="item"><div><b>${SLOT_NAMES[slot]}</b>：${it?`<span class="${RARITIES[it.rarity].cls}">${inferItemTier(it)}阶 ${it.name}</span> · 适配评分 <b>${itemScore(it)}</b> <span class="${fit[1]}">${fit[0]}</span><div class="muted">${itemText(it)}<br>${gearScoreDetail(it)}</div>`:'空'}</div>${it?`<div class="controls"><button onclick="refineItem('${it.id}')" ${(it.refine||0)>=5?'disabled':''}>精炼 ${((it.refine||0)>=5)?'已满':refineCost(it)+'金币'}</button><button onclick="unequip('${slot}')">卸下</button></div>`:''}</div>`}).join('')}</div>
 <div class="card" style="margin-top:10px"><h3>背包</h3>${ordered.map(it=>{const old=state.equipment[it.slot],delta=inventoryUpgradeDelta(it),positive=delta>0,fit=gearFitLabel(it);return`<div class="item"><div><span class="item-name ${RARITIES[it.rarity].cls}">${inferItemTier(it)}阶 ${it.name}</span> · ${SLOT_NAMES[it.slot]} · 适配评分 <b>${itemScore(it)}</b> <span class="${fit[1]}">${fit[0]}</span><div class="muted">${itemText(it)}<br>${gearScoreDetail(it)}</div><div class="compare ${positive?'risk-safe':'muted'}">${positive?`适配评分提升 +${delta}`:`无适配提升 ${delta}`}${old?`｜当前槽位${itemScore(old)}`:'｜当前槽位为空'}</div></div><div class="controls"><button onclick="equipItem('${it.id}')">装备</button><button onclick="refineItem('${it.id}')" ${(it.refine||0)>=5?'disabled':''}>精炼</button><button onclick="state.inventory.find(x=>x.id==='${it.id}').locked=!state.inventory.find(x=>x.id==='${it.id}').locked;render()">${it.locked?'解锁':'锁定'}</button><button ${it.locked?'disabled':''} onclick="sellItem('${it.id}')">出售${itemSellValue(it)}</button></div></div>`}).join('')||'<div class="muted">尚无装备。</div>'}</div>`;
}
function renderPets(){
 const f=state.petFilter||{minGrade:'F',minTier:1,action:'release',keepAnyS:true},counts=petTypeCounts(),mutants=state.pets.filter(p=>p.mutant).length;
 return`<div class="notice">宠物融合进化现在没有阶级上限。每升1阶都让生命、攻击、防御、魔力的基础倍率固定增加12%（线性叠加，不复利），幅度始终一致；地图自然掉落仍最高6阶，7阶以后全部来自同物种融合。1—10阶还会累计解锁独特“阶级本能”，10阶以后不再增加新机制，只继续无限提高全域倍率。</div>
 <div class="grid2"><div class="card"><h3>无限进阶规则</h3><div class="muted">目标阶级越高，需要的同阶普通素材越多。示例：${Array.from({length:10},(_,i)=>{const t=i+1;return`${t}→${t+1}约${petEvolutionSameTierCount(t)}只`}).join('｜')}。普通素材提供“自身阶级”点进阶经验；变异X仍提供100倍同阶经验，因此永远是极高价值的进阶素材。</div><p>全域成长：${Array.from({length:10},(_,i)=>`${i+1}阶×${petTierMult(i+1).toFixed(2)}`).join(' ｜ ')}</p></div>
 <div class="card"><h3>1—10阶本能</h3><div class="muted">${Object.entries(PET_TIER_INSTINCTS).map(([t,x])=>`${t}阶【${x.name}】${x.desc}`).join('<br>')}</div></div></div>
 <div class="grid2" style="margin-top:10px"><div class="card"><h3>自动筛选</h3><label>最低自然掉落阶级 <select onchange="state.petFilter.minTier=Number(this.value);save();render()">${Array.from({length:PET_TIER_MAX_UI},(_,i)=>i+1).map(t=>`<option value="${t}" ${Number(f.minTier||1)===t?'selected':''}>${t}阶</option>`).join('')}</select></label><p><label>最低综合资质 <select onchange="state.petFilter.minGrade=this.value;save();render()">${PET_GRADES.map(g=>`<option value="${g}" ${f.minGrade===g?'selected':''}>${g}</option>`).join('')}</select></label></p><p><label>低于阈值处理 <select onchange="state.petFilter.action=this.value;save();render()"><option value="release" ${f.action==='release'?'selected':''}>自动放归换精华</option><option value="feed" ${f.action==='feed'?'selected':''}>自动转化为宠物经验</option></select></label></p><label><input type="checkbox" ${f.keepAnyS?'checked':''} onchange="state.petFilter.keepAnyS=this.checked;save();render()"> 任一单项达到S时例外保留</label><div class="muted" style="margin-top:7px">7阶以上不会自然掉落，因此筛选只需要覆盖1—6阶。变异X始终不会被自动处理。</div></div>
 <div class="card"><h3>仓库概况</h3><p>攻击型 ${counts.Attack}｜防御型 ${counts.Defense}｜施法型 ${counts.Magic}｜平衡型 ${counts.Balance}</p><p>变异X：<span class="mutant-x">${mutants}</span>只</p><div class="muted">高阶不是新的物种，而是同一只宠物不断融合后的长期成长记录。开局宠物理论上可以无限养下去。</div></div></div>
 <div class="card" style="margin-top:10px"><h3>宠物仓 ${state.pets.length}/${state.petCapacity}</h3>${state.pets.slice().sort((a,b)=>petKeepScore(b)-petKeepScore(a)).map(p=>{
  const ps=petStats(p),grade=petOverallGrade(p),sp=petSpeciesData(p),plan=fusionPlan(p),xplan=mutantFusionPlan(p),hp=clamp(Number(p.hp||ps.maxHp),0,ps.maxHp),power=petCombatPower(p);
  const ordinaryCount=sameSpeciesDonors(p,false).length,mutantCount=sameSpeciesDonors(p,true).length;
  const fusionButton=plan?`<button onclick="mergePet('${p.id}')">${plan.apt?`融合：${PET_APT_NAMES[plan.apt.stat]}${plan.apt.to} +进阶${plan.evo}`:`融合进阶 +${plan.evo}`}</button>`:'';
  const mutantButton=xplan?`<button class="danger" onclick="mergeMutantPet('${p.id}')">消耗变异X +${xplan.evo}</button>`:'';
  return`<div class="pet-row ${p.mutant?'mutant-card':''}"><div class="pet-icon">${petTypeIcon(p.type)}</div><div style="flex:1"><b>${p.tier||1}阶 ${p.mutant?'<span class="mutant-x">变异 X</span> ':''}${p.name} Lv.${p.level}</b> · ${PET_TYPES[p.type].name} · 战力 <b>${power}</b> · 综合<span class="grade-${grade}">${grade}</span>${p.id===state.activePetId?' · 出战中':''}${p.locked?' · 已锁定':''}<div class="muted">${sp.archetype}｜${sp.desc}<br><b>培养：</b>${petBuildFit(p)}<br><b>阶级进化：</b>${petEvolutionText(p)}｜普通同类素材${ordinaryCount}只｜变异同类素材${mutantCount}只<br><b>阶级本能：</b>${petTierInstinctText(p)}<br><b>特性【${sp.trait}】：</b>${sp.traitDesc}<br><b>专属技能【${sp.skill}】：</b>${sp.skillDesc}<br><b>类型能力：</b>${PET_TYPES[p.type].desc}<br>${aptitudeText(p)}｜生命${Math.round(hp)}/${ps.maxHp} 攻击${ps.atk} 防御${ps.def} 魔力${ps.magic}</div></div><div class="controls"><button ${p.id===state.activePetId?'disabled':''} onclick="setActivePet('${p.id}')">出战</button><button onclick="togglePetLock('${p.id}')">${p.locked?'解锁':'锁定'}</button><button onclick="feedPet('${p.id}')">经验转化</button>${fusionButton}${mutantButton}<button onclick="releasePet('${p.id}')">放归+${petDustValue(p)}</button></div></div>`}).join('')||'<div class="muted">尚无宠物。</div>'}</div>`;
}
function renderShop(){
 const p=activePet(),apt=p?aptitudeTrainingCosts(p):null;
 return`<div class="notice">金币不再只是出售结算数字。所有消费均为确定性结果，不设置失败、降级或装备破碎。</div>
 <div class="grid2">
 <div class="card"><h3>装备行商</h3><p>购买一件按当前地图和等级生成的随机装备。</p><button onclick="buyMerchantGear()">购买装备 · ${merchantGearCost()}金币</button></div>
 <div class="card"><h3>仓库扩建</h3><p>装备背包：${state.inventory.length}/${state.inventoryCapacity}</p><button onclick="expandInventory()">扩建+5 · ${300+(state.inventoryCapacity-40)*45}金币</button><p>宠物仓：${state.pets.length}/${state.petCapacity}</p><button onclick="expandPetCapacity()">扩建+2 · ${500+(state.petCapacity-12)*120}金币</button></div>
 </div>
 <div class="grid2" style="margin-top:10px">
 <div class="card"><h3>宠物等级训练</h3>${p?`<p>${p.tier||1}阶 ${p.name} Lv.${p.level}｜综合<span class="grade-${petOverallGrade(p)}">${petOverallGrade(p)}</span><br>${petEvolutionText(p)}</p><button onclick="trainActivePet()">训练宠物经验 · ${activePetTrainingCost()}金币</button><div class="muted" style="margin-top:7px">宠物等级上限Lv.100；到达上限后，长期战力成长主要依靠无限融合阶级与资质。阶级没有上限，只能通过同物种融合持续进化。</div>`:'<div class="muted">获得并选择出战宠物后开放。</div>'}</div>
 <div class="card"><h3>资质训练</h3>${p?`<p>优先提升当前最弱资质：${PET_APT_NAMES[apt.key]} ${migratePetAptitudes(p)[apt.key]} → ${gradeFromIndex(gradeIndex(migratePetAptitudes(p)[apt.key])+1)}</p><button onclick="trainPetAptitude()" ${gradeIndex(migratePetAptitudes(p)[apt.key])>=8?'disabled':''}>训练 · ${apt.gold}金币 + ${apt.dust}精华</button>`:'<div class="muted">获得并选择出战宠物后开放。</div>'}</div>
 </div>
 <div class="card" style="margin-top:10px"><h3>铁匠说明</h3><p>装备精炼入口位于“装备”页面。每件装备最高+5，每级使该装备属性提高8%，费用随品质与精炼等级上升。</p></div>`;
}
function renderMaps(){
 return`<div class="notice">所有地图从开始游戏起都可以自由进入，没有等级、转生或剧情硬门槛。真正的门槛只有战斗力：你可以Lv.1直接进入星渊，但结果通常就是不断战败。危险度仍只影响掉落，不改变敌人强度。</div>
 ${MAPS.map(m=>{const effective=effectiveMapCp(m),ratio=effective/Math.max(1,cp()),risk=ratio<.75?['安全','risk-safe']:ratio<1.35?['适中','risk-even']:ratio<2.5?['高危','risk-hard']:['几乎无法生存','risk-hard'],bp=state.bossProgress[m.id],metric=ensureMetric(m.id),actual=metric.battles?`${(metric.wins/metric.battles*100).toFixed(1)}%`:'—',cycle=ensureBossCycle(m.id),d=dangerDropProfile(m.id),baseRatio=m.cp/MAPS[0].cp;
 return`<div class="map-card ${state.mapId===m.id?'selected':''}"><div class="map-head"><b>${m.name} · 危险度T${cycle.threatTier||0}/${threatCapText(m.id)}</b><span class="${risk[1]}">${risk[0]} · 地图CP ${effective}</span></div><div class="muted">地图基准CP ${m.cp}（草原×${baseRatio.toFixed(1)}）｜敌人等级${m.levels[0]}—${m.levels[1]}｜装备固定${m.gearTier}阶｜宠物固定${m.petTier}阶<br>当前掉落加成：装备掉落×${d.gearDrop.toFixed(2)}｜Boss宠物×${d.petDrop.toFixed(2)}｜神话概率×${d.mythic.toFixed(2)}｜变异X概率×${d.mutation.toFixed(2)}${d.maxed?'｜<span class="r5">最高有效危险度掉落</span>':''}<br>当前地图CP约为角色CP的×${ratio.toFixed(2)}｜失败压力 ${(cycle.dangerFail||0).toFixed(1)}/3（达到3时危险度-1）｜预计胜率${estimatedWin(m)}%｜实际胜率${actual}<br>怪物：${m.monsters.join('、')}｜区域Boss：${m.boss}<br>${bossEncounterText(m.id)}${bp?`｜Boss剩余${Math.round(bp.hp)}/${bp.maxHp}`:''}｜Boss击败${cycle.bossWins}次</div><div class="controls"><button ${state.mapId===m.id?'disabled':''} onclick="changeMap('${m.id}')">前往</button></div></div>`}).join('')}`;
}
function renderTitles(){
 return`<div class="notice">一次只能装备一个称号。部分称号带有明显取舍，而不是单纯永久加成。</div>${Object.entries(TITLES).map(([id,t])=>{const unlocked=state.titlesUnlocked.includes(id);return`<div class="item"><div><b>${t.name}</b>${state.equippedTitle===id?' · 已装备':''}<div class="muted">${t.desc}<br>${unlocked?'已解锁':'尚未满足条件'}</div></div><button ${!unlocked?'disabled':''} onclick="state.equippedTitle=state.equippedTitle==='${id}'?null:'${id}';render()">${state.equippedTitle===id?'卸下':'装备'}</button></div>`}).join('')}`;
}
function renderRebirth(){
 const rp=rebirthProfile(),laws=ensureRebirthLaws(),can=state.level>=100,next=state.rebirths+1;state.nextRace=RACES[state.nextRace]?state.nextRace:state.race;state.nextStyle=STYLES[state.nextStyle]?state.nextStyle:state.style;
 return`<div class="notice">转生是“重新跑一轮但总进度更快”，不是地图钥匙。装备、宠物、技能熟练和专精都保留；可以在转生时直接换种族与职业。轮回共鸣只小幅提高战斗力，主要提高经验/熟练/宠物成长效率。</div>
 <div class="grid2"><div class="card law-card"><h3>轮回共鸣 · R${state.rebirths}</h3><p class="rebirth-power">玩家攻击×${rp.damage.toFixed(2)}｜宠物输出×${rp.petPower.toFixed(2)}｜经验×${rp.xp.toFixed(2)}</p><div class="muted">技能熟练×${rp.skillMastery.toFixed(2)}｜宠物经验×${rp.petXp.toFixed(2)}。基础轮回不提高生命、防御、金币、神话或变异概率。</div></div>
 <div class="card"><h3>下一轮身份</h3><label>种族 <select onchange="state.nextRace=this.value;save();render()">${Object.entries(RACES).map(([id,r])=>`<option value="${id}" ${state.nextRace===id?'selected':''}>${r.name}</option>`).join('')}</select></label><p><label>职业 <select onchange="state.nextStyle=this.value;save();render()">${Object.entries(STYLES).map(([id,s])=>`<option value="${id}" ${state.nextStyle===id?'selected':''}>${s.name}</option>`).join('')}</select></label></p><div class="muted">${RACES[state.nextRace].bonusText}<br>${styleGrowthText(state.nextStyle,state.nextRace)}<br>切职业不会删除旧职业技能熟练与Lv.10专精。</div></div></div>
 <div class="card" style="margin-top:10px"><h3>第${next}次转生：法则刻印</h3><div class="muted">三项法则最高Lv.${REBIRTH_LAW_MAX}。时流Boss周期：Lv.0 16只后开始/24只保底；Lv.1 10/17；Lv.2 5/10；Lv.3 1/3。</div>${Object.entries(REBIRTH_LAWS).map(([id,l])=>{const maxed=(laws[id]||0)>=REBIRTH_LAW_MAX;return`<label class="skill-row ${state.pendingRebirthLaw===id?'on':''}" style="cursor:${maxed?'default':'pointer'};opacity:${maxed?.65:1}"><input type="radio" name="rebirth-law" value="${id}" ${state.pendingRebirthLaw===id?'checked':''} ${maxed?'disabled':''} onchange="state.pendingRebirthLaw='${id}';save();render()"> <div><b class="law-name">${l.name} Lv.${laws[id]||0}${maxed?' MAX':` → Lv.${(laws[id]||0)+1}`}</b><div class="muted">${l.desc}</div></div></label>`}).join('')}<button ${can?'':'disabled'} onclick="rebirth()">执行第${next}次转生</button></div>`;
}
if(!load())state=fresh();
render();
tickTimer=setInterval(battleTick,650);
saveTimer=setInterval(save,10000);
window.addEventListener('beforeunload',save);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker registration failed',err)));
}
</script>
</body>
</html>
