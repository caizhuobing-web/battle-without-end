<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#1f1730" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>万变之种</title>
    <link rel="preload" href="./font.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./style.css?v=5" />
  </head>
  <body>
    <div id="app">
      <header id="top">
        <div class="brand">万变之种</div>
        <div class="res" title="DNA，用于基因强化"><img class="px" id="dnaIc" alt="DNA" /><span id="dna">0</span></div>
        <button id="bAuto" class="chip" title="自动选择变异，到设定的层数自动上浮">挂机 关</button>
        <button id="bSpd" class="chip" title="游戏速度">×1</button>
        <button id="bPause" class="chip" title="空格键">暂停</button>
        <button id="bSnd" class="chip">有声</button>
      </header>
      <main>
        <section id="stage">
          <div id="hud">
            <div class="row">
              <span id="wv" class="lbl">第 1 波</span>
              <div class="bar wave"><i id="wvBar"></i></div>
              <span id="diffN" class="lbl dim"></span>
            </div>
            <div class="row">
              <div class="bar hp"><i id="shBar"></i><i id="hpBar"></i><em id="hpTxt"></em></div>
            </div>
            <div class="row">
              <span id="lvTxt" class="lbl">Lv 1</span>
              <div class="bar xp"><i id="xpBar"></i></div>
              <span id="formN" class="lbl form"></span>
            </div>
            <div class="row carry">
              <span class="lbl dim">携带</span><img class="px" id="carryIc" alt="DNA" /><span id="carry">0</span><span class="lbl dim">样本</span><span id="carrySp">无</span>
            </div>
          </div>
          <div id="cvWrap">
            <canvas id="cv"></canvas>
            <div id="bossBar" hidden><span id="bossLbl">领主</span><div class="bar boss"><i id="bossFill"></i></div></div>
            <div id="toast"></div>
            <div id="start"></div>
          </div>
          <div id="skills"></div>
        </section>
        <section id="side">
          <nav id="tabs">
            <button data-tab="build" class="on">本局</button>
            <button data-tab="tree">图鉴</button>
            <button data-tab="gene">营地</button>
            <button data-tab="opt">设置</button>
          </nav>
          <div id="panel"></div>
        </section>
      </main>
      <div id="modal" hidden></div>
    </div>
    <script src="./data.js?v=5"></script>
    <script src="./sim.js?v=5"></script>
    <script src="./audio.js?v=5"></script>
    <script src="./pixel.js?v=5"></script>
    <script src="./ui.js?v=5"></script>
    <script>
      /* 启动失败时的自救界面：不让坏存档把游戏卡死。 */
      if (!window.__evo) {
        var raw = "";
        try { raw = localStorage.getItem("evoSeed.save.v1") || ""; } catch (e) {}
        document.getElementById("app").innerHTML =
          '<div style="padding:16px;max-width:32em;margin:0 auto"><h3>游戏没能启动</h3><p>可能是存档损坏。可以先复制下面的原始存档留底，再重置存档。</p>' +
          '<textarea readonly style="height:120px"></textarea><p style="margin-top:10px"><button class="btn" id="rescue">重置存档并重新启动</button></p></div>';
        document.querySelector("textarea").value = raw;
        document.getElementById("rescue").onclick = function () {
          try { localStorage.removeItem("evoSeed.save.v1"); } catch (e) {}
          location.reload();
        };
      }
    </script>
  </body>
</html>
