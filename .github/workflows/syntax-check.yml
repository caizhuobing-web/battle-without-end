name: Alpha 0.45 Lifelong Companion Gate
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime and regression suite
        run: |
          for f in *.js api/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          node tests/alpha-039-regression.js
